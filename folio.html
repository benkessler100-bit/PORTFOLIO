<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chen Kessler — Portfolio</title>
<!-- This page became the homepage on 15 Aug 2026. Anything already pointing at
     /folio.html keeps working through this redirect.
     noindex matters as much as the canonical here: a meta-refresh stub answers
     200, not 301, so without it Google is free to treat this as a second page
     carrying the same content. Amplify has no repo-side redirects file — if you
     want a real 301, add it under Hosting → Rewrites and redirects. -->
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://chenkessler.com/" />
<meta http-equiv="refresh" content="0; url=./" />
<script>location.replace('./');</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#efece4;color:#1e3a2b;
       font-family:system-ui,sans-serif;font-size:15px;letter-spacing:.02em}
  a{color:inherit}
</style>
</head>
<body>
  <p>Moved to <a href="./">the portfolio</a>.</p>
</body>
</html>
