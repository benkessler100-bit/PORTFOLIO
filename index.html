<style>
  :root {
    --bg: #0a0a0a;
    --paper: #f4ede1;
    --ink: #e9e4d8;
    --muted: #8c8676;
    --accent: #d8c89a;
    --line: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  .gate {
    display: flex;
    height: 100vh;
    height: 100dvh;
  }

  .half {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 8vh 5vw;
    text-decoration: none;
    background-size: cover;
    background-position: center;
    overflow: hidden;
    transition: flex .6s cubic-bezier(.4, 0, .2, 1);
  }
  .half::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,10,10,0.55) 0%, rgba(10,10,10,0.25) 45%, rgba(10,10,10,0.82) 100%);
    transition: background .5s ease;
  }
  .half::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(10,10,10,0.25);
    transition: background .5s ease;
  }
  .half:hover { flex: 1.45; }
  .half:hover::after { background: rgba(10,10,10,0); }

  .half > * { position: relative; z-index: 2; }

  .half-kicker {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .half-label {
    font-family: 'Bebas Neue';
    font-size: clamp(46px, 7vw, 110px);
    line-height: 0.9;
    letter-spacing: 3px;
    color: var(--paper);
  }
  .half-sub {
    margin-top: 14px;
    color: var(--ink);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.8;
  }
  .half-enter {
    margin-top: 26px;
    display: inline-block;
    font-family: 'Bebas Neue';
    letter-spacing: 5px;
    font-size: 14px;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 10px 26px;
    border-radius: 999px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .4s ease, transform .4s ease;
    align-self: flex-start;
  }
  .half:hover .half-enter { opacity: 1; transform: translateY(0); }

  .divider {
    width: 1px;
    background: var(--line);
    z-index: 3;
  }

  .brand {
    position: fixed;
    top: 6vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }
  .brand h1 {
    font-family: 'Bebas Neue';
    font-size: clamp(26px, 3vw, 44px);
    letter-spacing: 8px;
    color: var(--paper);
  }
  .brand p {
    margin-top: 6px;
    font-family: 'Cormorant Garamond';
    font-style: italic;
    font-size: 17px;
    color: var(--accent);
  }

  .foot {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
  }

  @media (max-width: 760px) {
    .gate { flex-direction: column; }
    .divider { width: auto; height: 1px; }
    .half { padding: 6vh 8vw; justify-content: flex-end; }
    .half:hover { flex: 1.2; }
    .half-enter { display: none; }
    .brand { width: 100%; }
  }
  /* Entrance animation */
  .half { animation: half-in 1.1s cubic-bezier(.22,1,.36,1) backwards; }
  .gate .half:first-child { animation-delay: .1s; }
  .gate .half:last-child { animation-delay: .28s; }
  @keyframes half-in {
    from { opacity: 0; transform: scale(1.045); filter: brightness(0.4); }
    to   { opacity: 1; transform: none; filter: brightness(1); }
  }
  .brand { animation: brand-in .9s cubic-bezier(.22,1,.36,1) .55s backwards; }
  @keyframes brand-in {
    from { opacity: 0; transform: translateX(-50%) translateY(-14px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  .foot { animation: foot-in 1s ease .9s backwards; }
  @keyframes foot-in { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .half, .brand, .foot { animation: none; }
  }

  /* Short screens (landscape phones): fixed brand/foot collide with the halves — slim everything down */
  @media (max-height: 500px) {
    .brand { top: 12px; }
    .brand p, .foot { display: none; }
    .half { padding: 4vh 6vw; }
    .half-sub, .half-kicker { display: none; }
    .half-label { font-size: clamp(34px, 9vh, 64px); }
  }
</style>
</head>
