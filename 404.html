<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Not found — Chen Kessler</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta name="theme-color" content="#1e3a2b" />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{--paper:#efece4;--green:#1e3a2b;--ink:#15211a}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);min-height:100vh;
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  display:grid;place-items:center;padding:clamp(20px,6vw,80px);text-align:center;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23g)'/></svg>");
  background-size:200px 200px;
}
h1{
  font-family:'Poppins',sans-serif;font-weight:600;color:var(--green);
  font-size:clamp(64px,18vw,220px);line-height:.84;letter-spacing:-.05em;
}
p{margin-top:clamp(14px,2vw,24px);font-size:clamp(14px,1.1vw,17px);opacity:.75}
a{
  display:inline-block;margin-top:clamp(22px,3vw,38px);text-decoration:none;
  background:var(--green);color:var(--paper);border-radius:999px;
  padding:.75em 1.9em;font-family:'Poppins',sans-serif;font-weight:600;
  font-size:clamp(13px,1vw,15px);transition:transform .3s cubic-bezier(.16,.84,.28,1)
}
a:hover{transform:translateY(-2px)}
.sig{
  position:fixed;bottom:clamp(16px,3vw,34px);left:0;right:0;
  font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.5;
}
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>That page isn't here.</p>
    <a href="./">Back to the portfolio</a>
  </main>
  <div class="sig">Chen Kessler — Filmmaker &amp; Photographer, Tel Aviv</div>
</body>
</html>
